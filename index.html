<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phụ Đề Cuộc Họp AI Trung/Anh - Việt</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; height: 95vh; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; }
        .app-title { font-weight: bold; font-size: 15px; color: #38bdf8; }
        .version-badge { background: #8b5cf6; color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 20px; }

        .header { background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 13px; }
        input, select { width: 100%; padding: 8px 12px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: white; margin-top: 5px; font-size: 14px; }
        
        /* Khu vực nút test nhanh */
        .test-box { background: #1e293b; padding: 10px; border-radius: 10px; margin-bottom: 10px; font-size: 12px; }
        .test-btns { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
        .btn-sample { background: #334155; color: #38bdf8; border: 1px solid #475569; padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }

        .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        .btn-mic {
            flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer;
            background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-mic.active { background: #dc2626; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .btn-log {
            padding: 12px 14px; background: #475569; color: white; border: none; border-radius: 10px;
            font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap;
        }

        .tts-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #94a3b8; margin-bottom: 10px; padding: 0 4px; }
        
        .live-preview {
            background: #1e293b; border-left: 3px solid #38bdf8; padding: 10px; border-radius: 6px;
            font-size: 14px; min-height: 38px; color: #38bdf8; margin-bottom: 10px;
        }

        .transcript-box {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
            padding-right: 4px; scroll-behavior: smooth;
        }
        .message-card { background: #1e293b; padding: 12px; border-radius: 10px; border: 1px solid #334155; }
        .chinese-line { color: #94a3b8; font-size: 14px; margin-bottom: 4px; }
        .vietnamese-line { color: #4ade80; font-size: 16px; font-weight: 500; }
        
        .log-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            display: none; flex-direction: column; padding: 20px; z-index: 9999;
        }
        .log-content {
            background: #0f172a; border: 1px solid #334155; border-radius: 12px; flex: 1;
            display: flex; flex-direction: column; padding: 15px; overflow: hidden;
        }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .log-title { font-weight: bold; font-size: 16px; color: #38bdf8; }
        .log-actions { display: flex; gap: 8px; }
        .log-btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-copy { background: #22c55e; color: white; }
        .btn-clear { background: #ef4444; color: white; }
        .btn-close { background: #64748b; color: white; }
        textarea#logViewer {
            flex: 1; width: 100%; background: #020617; color: #a5f3fc; border: 1px solid #1e293b;
            border-radius: 6px; padding: 10px; font-family: monospace; font-size: 12px; resize: none; outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="app-title">🌐 AI Phiên Dịch Cabin</div>
        <div class="version-badge" id="versionTag">Bản v2.4 (Test Tiếng Anh & Nút Mẫu)</div>
    </div>

    <div class="header">
        <label>Google Gemini API Key:</label>
        <input type="password" id="apiKey" placeholder="Dán API Key vào đây..." onchange="saveKey()">
        
        <label style="margin-top: 8px; display: block;">Ngôn ngữ đang nghe vào:</label>
        <select id="langSelect" onchange="changeLanguage()">
            <option value="zh-CN" selected>🇨🇳 Tiếng Trung (Mặc định cho cuộc họp)</option>
            <option value="en-US">🇺🇸 Tiếng Anh (Dành cho bạn nói test)</option>
        </select>
    </div>

    <!-- Khu vực bấm thử không cần nói -->
    <div class="test-box">
        <span style="color: #94a3b8;">Bấm thử mẫu tiếng Trung (Không cần nói):</span>
        <div class="test-btns">
            <button class="btn-sample" onclick="testSample('你好，很高兴认识你。')">🗣️ Chào hỏi</button>
            <button class="btn-sample" onclick="testSample('我们现在开始今天的会议。')">🗣️ Bắt đầu họp</button>
            <button class="btn-sample" onclick="testSample('这个项目的进度目前非常顺利。')">🗣️ Báo cáo tiến độ</button>
        </div>
    </div>

    <div class="controls">
        <button id="micBtn" class="btn-mic" onclick="toggleMeeting()">
            <span id="micIcon">🎙️</span> <span id="btnText">BẮT ĐẦU CUỘC HỌP</span>
        </button>
        <button class="btn-log" onclick="openLogModal()">📋 Xem Log</button>
    </div>

    <div class="tts-bar">
        <span>Trạng thái: Dịch sang Tiếng Việt</span>
        <label style="cursor: pointer;">
            <input type="checkbox" id="ttsCheckbox" checked> Đọc tiếng Việt (🎧)
        </label>
    </div>

    <div class="live-preview" id="livePreview">Sẵn sàng. Bấm bắt đầu để nói hoặc bấm nút mẫu ở trên...</div>
    <div class="transcript-box" id="transcript"></div>
</div>

<!-- Modal Log -->
<div class="log-modal" id="logModal">
    <div class="log-content">
        <div class="log-header">
            <span class="log-title">Nhật Ký Lỗi & Hệ Thống</span>
            <div class="log-actions">
                <button class="log-btn btn-copy" onclick="copyLog()">📋 Sao chép Log</button>
                <button class="log-btn btn-clear" onclick="clearLog()">Xóa</button>
                <button class="log-btn btn-close" onclick="closeLogModal()">Đóng ✖</button>
            </div>
        </div>
        <textarea id="logViewer" readonly placeholder="Chưa có log..."></textarea>
    </div>
</div>

<script>
    const APP_VERSION = "v2.4 (Dual Language Test + Mock Buttons)";
    const logs = [];
    let activeModel = "gemini-flash-lite-latest"; 

    function addLog(tag, message, data = null) {
        const time = new Date().toLocaleTimeString();
        let logItem = `[${time}] [${tag}] ${message}`;
        if (data) {
            try {
                logItem += "\n" + (typeof data === 'object' ? JSON.stringify(data, null, 2) : data);
            } catch (e) {
                logItem += "\n" + data;
            }
        }
        logs.push(logItem);
        console.log(logItem);

        const viewer = document.getElementById("logViewer");
        if (viewer) {
            viewer.value = logs.join("\n\n---------------------\n\n");
            viewer.scrollTop = viewer.scrollHeight;
        }
    }

    function openLogModal() {
        document.getElementById("logModal").style.display = "flex";
        const viewer = document.getElementById("logViewer");
        viewer.value = logs.join("\n\n---------------------\n\n");
        viewer.scrollTop = viewer.scrollHeight;
    }

    function closeLogModal() {
        document.getElementById("logModal").style.display = "none";
    }

    function clearLog() {
        logs.length = 0;
        document.getElementById("logViewer").value = "";
        addLog("SYSTEM", "Đã xóa log.");
    }

    async function copyLog() {
        const viewer = document.getElementById("logViewer");
        try {
            await navigator.clipboard.writeText(viewer.value);
            alert("✅ Đã sao chép log!");
        } catch (err) {
            viewer.select();
            document.execCommand('copy');
            alert("✅ Đã sao chép log!");
        }
    }

    function unlockAudioOnIOS() {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.resume();
        const silentUtterance = new SpeechSynthesisUtterance(" ");
        silentUtterance.volume = 0.05;
        window.speechSynthesis.speak(silentUtterance);
        addLog("AUDIO", "Đã mở khóa loa Safari.");
    }

    async function setupFastestModel(key) {
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
            const data = await res.json();
            if (data.models) {
                const available = data.models.map(m => m.name.replace("models/", ""));
                const fastCandidates = [
                    "gemini-flash-lite-latest",
                    "gemini-2.5-flash-lite",
                    "gemini-3.1-flash-lite",
                    "gemini-3.5-flash-lite",
                    "gemini-3.6-flash"
                ];
                for (let cand of fastCandidates) {
                    if (available.includes(cand)) {
                        activeModel = cand;
                        break;
                    }
                }
                addLog("MODEL_CONFIG", `Model hoạt động: [${activeModel}]`);
            }
        } catch (e) {
            addLog("MODEL_CONFIG", `Dùng model dự phòng: [${activeModel}]`);
        }
    }

    window.onload = async () => {
        addLog("SYSTEM", `Khởi động ứng dụng ${APP_VERSION}`);
        const savedKey = localStorage.getItem("gemini_key");
        if (savedKey) {
            document.getElementById("apiKey").value = savedKey;
            await setupFastestModel(savedKey);
        }
    };

    async function saveKey() {
        const key = document.getElementById("apiKey").value.trim();
        localStorage.setItem("gemini_key", key);
        addLog("AUTH", "Đã lưu API Key.");
        await setupFastestModel(key);
    }

    function changeLanguage() {
        const lang = document.getElementById("langSelect").value;
        if (recognition) {
            recognition.lang = lang;
            addLog("STT_CONFIG", `Đã đổi ngôn ngữ micro sang: ${lang}`);
            if (isMeetingActive) {
                recognition.stop();
                setTimeout(() => { try { recognition.start(); } catch(e){} }, 300);
            }
        }
    }

    // Speech-to-Text
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isMeetingActive = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => addLog("STT", `Micro bắt đầu lắng nghe (${recognition.lang})...`);
        
        recognition.onresult = (event) => {
            let interimText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const transcriptPart = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    addLog("STT_FINAL", `Ngắt câu: "${transcriptPart}"`);
                    processCompletedSentence(transcriptPart.trim());
                } else {
                    interimText += transcriptPart;
                }
            }
            if (interimText) {
                document.getElementById("livePreview").innerText = "Đang nghe: " + interimText;
            }
        };

        recognition.onerror = (event) => addLog("STT_ERROR", `Lỗi: ${event.error}`);

        recognition.onend = () => {
            if (isMeetingActive) {
                try { recognition.start(); } catch (e) {}
            }
        };
    }

    function toggleMeeting() {
        const key = document.getElementById("apiKey").value.trim();
        if (!key) {
            alert("Vui lòng nhập Gemini API Key trước!");
            return;
        }
        isMeetingActive ? stopMeeting() : startMeeting();
    }

    function startMeeting() {
        unlockAudioOnIOS();
        isMeetingActive = true;
        document.getElementById("micBtn").classList.add("active");
        document.getElementById("btnText").innerText = "DỪNG CUỘC HỌP";
        document.getElementById("livePreview").innerText = "Đang lắng nghe...";
        addLog("ACTION", "Bắt đầu cuộc họp.");
        try { recognition.start(); } catch (e) {}
    }

    function stopMeeting() {
        isMeetingActive = false;
        document.getElementById("micBtn").classList.remove("active");
        document.getElementById("btnText").innerText = "BẮT ĐẦU CUỘC HỌP";
        document.getElementById("livePreview").innerText = "Đã dừng cuộc họp.";
        addLog("ACTION", "Dừng cuộc họp.");
        try { recognition.stop(); } catch (e) {}
    }

    // Nút test mẫu nhanh
    function testSample(text) {
        unlockAudioOnIOS();
        processCompletedSentence(text);
    }

    async function processCompletedSentence(originalText) {
        if (!originalText) return;
        document.getElementById("livePreview").innerText = "Đang dịch: " + originalText;

        const transcriptBox = document.getElementById("transcript");
        const card = document.createElement("div");
        card.className = "message-card";
        card.innerHTML = `
            <div class="chinese-line">🗣️ ${originalText}</div>
            <div class="vietnamese-line">⚡ Đang dịch sang Tiếng Việt...</div>
        `;
        transcriptBox.prepend(card);

        const vietnameseTranslation = await translateWithAI(originalText);
        card.querySelector(".vietnamese-line").innerText = "🇻🇳 " + vietnameseTranslation;

        if (document.getElementById("ttsCheckbox").checked && !vietnameseTranslation.startsWith("Lỗi")) {
            speakVietnamese(vietnameseTranslation);
        }
    }

    async function translateWithAI(text) {
        const apiKey = document.getElementById("apiKey").value.trim();
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${apiKey}`;

        const prompt = `Bạn là phiên dịch viên cabin. Hãy dịch câu giao tiếp sau đây sang tiếng Việt chuẩn ngữ cảnh, tự nhiên nhất. CHỈ TRẢ VỀ DUY NHẤT BẢN DỊCH TIẾNG VIỆT:\n"${text}"`;

        const requestBody = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
                maxOutputTokens: 80,
                temperature: 0.1
            }
        };

        const startTime = Date.now();
        addLog("AI_REQUEST", `[${activeModel}] Dịch câu: "${text}"`);

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestBody)
            });

            const data = await response.json();
            const elapsed = Date.now() - startTime;

            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                const result = data.candidates[0].content.parts[0].text.trim();
                addLog("AI_SUCCESS", `Dịch xong trong [${elapsed}ms]: "${result}"`);
                return result;
            } else {
                addLog("AI_WARN", "Phản hồi bất thường:", data);
            }
        } catch (err) {
            addLog("AI_ERROR", "Lỗi fetch:", err.message);
        }
        return "Lỗi dịch (Xem Log)";
    }

    function speakVietnamese(text) {
        if (!window.speechSynthesis) return;
        
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'vi-VN';
        utterance.rate = 1.1;

        const voices = window.speechSynthesis.getVoices();
        const viVoice = voices.find(v => v.lang && (v.lang.startsWith('vi') || v.lang.includes('VIE')));
        if (viVoice) utterance.voice = viVoice;
        
        utterance.onstart = () => addLog("TTS_PLAY", `Loa đang đọc: "${text}"`);
        utterance.onerror = (e) => addLog("TTS_ERROR", `Lỗi âm thanh: ${e.error}`);

        addLog("TTS_QUEUE", `Gửi lệnh đọc tới hệ thống: "${text}"`);
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
