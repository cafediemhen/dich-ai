<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phụ Đề Cabin Trung - Việt</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f1f5f9; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; height: 96vh; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .app-title { font-weight: bold; font-size: 15px; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
        .version-badge { background: #059669; color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 20px; }

        .header { background: #1e293b; padding: 10px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; }
        input { width: 100%; padding: 8px 12px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: white; margin-top: 4px; font-size: 13px; }

        .btn-mic {
            width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;
            background: #2563eb; color: white; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(37,99,235,0.4); margin-bottom: 8px;
        }
        .btn-mic.active { background: #dc2626; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .options-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; margin-bottom: 8px; padding: 0 4px; }

        /* Khung hiển thị câu tiếng Trung đang nói trực tiếp */
        .live-stream-box {
            background: #1e293b; border-left: 3px solid #38bdf8; padding: 10px 12px; border-radius: 8px;
            font-size: 14px; min-height: 42px; color: #38bdf8; margin-bottom: 10px; line-height: 1.4;
        }

        /* Danh sách phụ đề đã dịch */
        .transcript-box {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
            padding-right: 4px; scroll-behavior: smooth;
        }
        .card { background: #1e293b; padding: 12px; border-radius: 10px; border: 1px solid #334155; }
        .card-zh { color: #94a3b8; font-size: 14px; margin-bottom: 4px; line-height: 1.4; }
        .card-vi { color: #4ade80; font-size: 16px; font-weight: bold; line-height: 1.4; }

        .footer-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: #64748b; }
        .btn-log { background: #334155; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; }

        .log-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; padding: 20px; z-index: 9999; }
        .log-content { background: #0f172a; border: 1px solid #334155; border-radius: 12px; flex: 1; display: flex; flex-direction: column; padding: 15px; }
        textarea#logViewer { flex: 1; width: 100%; background: #020617; color: #a5f3fc; border: 1px solid #1e293b; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; resize: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="app-title">🇨🇳 ➔ 🇻🇳 Phiên Dịch Cuộc Họp Trực Tiếp</div>
        <div class="version-badge">v4.0 (Ngắt Cuốn Chiếu)</div>
    </div>

    <div class="header">
        <label>Google Gemini API Key:</label>
        <input type="password" id="apiKey" placeholder="Dán Gemini API Key vào đây..." onchange="saveKey()">
    </div>

    <button id="mainBtn" class="btn-mic" onclick="toggleMeeting()">
        <span>🎙️</span> <span id="btnText">BẮT ĐẦU DỊCH CUỘC HỌP</span>
    </button>

    <div class="options-bar">
        <span>Chế độ: Ngắt câu theo nhịp thở (0.4s)</span>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="ttsCheckbox" checked> Đọc tiếng Việt (🎧)
        </label>
    </div>

    <!-- Đoạn văn bản đang nghe dở thời gian thực -->
    <div class="live-stream-box" id="livePreview">Sẵn sàng. Bấm bắt đầu để nghe đối tác nói...</div>

    <!-- Dòng chảy phụ đề cuộc họp -->
    <div class="transcript-box" id="transcript"></div>

    <div class="footer-tools">
        <span>Tự động cuộn theo tiến trình họp</span>
        <button class="btn-log" onclick="openLog()">📋 Xem Log</button>
    </div>
</div>

<!-- Modal Log -->
<div class="log-modal" id="logModal">
    <div class="log-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <b style="color:#38bdf8;">Nhật Ký Hệ Thống</b>
            <div>
                <button onclick="copyLog()" style="background:#22c55e; color:white; border:none; padding:4px 8px; border-radius:4px;">Copy</button>
                <button onclick="closeLog()" style="background:#64748b; color:white; border:none; padding:4px 8px; border-radius:4px;">Đóng</button>
            </div>
        </div>
        <textarea id="logViewer" readonly></textarea>
    </div>
</div>

<script>
    const logs = [];
    let isMeetingActive = false;
    let recognition = null;
    let activeModel = "gemini-flash-lite-latest";

    // Thuật toán ngắt câu thông minh
    let processedLength = 0;
    let interimBuffer = "";
    let chunkTimer = null;
    const CHUNK_MAX_CHARS = 12; // Cứ đạt 12 chữ Hán là tự động ngắt dịch ngay
    const IDLE_DISPATCH_MS = 450; // Sau 0.45s người nói dừng nhẹ là chốt cụm từ gửi dịch luôn

    // Hàng đợi phát âm thanh
    const ttsQueue = [];
    let isSpeaking = false;

    function addLog(tag, msg, data = null) {
        const time = new Date().toLocaleTimeString();
        let item = `[${time}] [${tag}] ${msg}`;
        if (data) item += "\n" + (typeof data === 'object' ? JSON.stringify(data) : data);
        logs.push(item);
        console.log(item);
        const v = document.getElementById("logViewer");
        if (v) v.value = logs.join("\n\n");
    }

    function openLog() { document.getElementById("logModal").style.display = "flex"; }
    function closeLog() { document.getElementById("logModal").style.display = "none"; }
    function copyLog() {
        navigator.clipboard.writeText(document.getElementById("logViewer").value);
        alert("Đã copy toàn bộ log!");
    }

    async function checkModel(key) {
        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
            const data = await res.json();
            if (data.models) {
                const list = data.models.map(m => m.name.replace("models/", ""));
                const fastList = ["gemini-flash-lite-latest", "gemini-2.5-flash-lite", "gemini-3.6-flash"];
                for (let m of fastList) {
                    if (list.includes(m)) { activeModel = m; break; }
                }
                addLog("MODEL", `Model tối ưu tốc độ: [${activeModel}]`);
            }
        } catch(e) {}
    }

    window.onload = async () => {
        const k = localStorage.getItem("gemini_key");
        if (k) {
            document.getElementById("apiKey").value = k;
            await checkModel(k);
        }
    };

    function saveKey() {
        const k = document.getElementById("apiKey").value.trim();
        localStorage.setItem("gemini_key", k);
        checkModel(k);
    }

    function unlockAudio() {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.resume();
        const u = new SpeechSynthesisUtterance(" ");
        u.volume = 0.01;
        window.speechSynthesis.speak(u);
    }

    // KHỞI TẠO BỘ NHẬN DIỆN TIẾNG TRUNG BẢN ĐỊA CỦA APPLE
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            addLog("STT", "Micro đang lắng nghe tiếng Trung cuộc họp...");
        };

        recognition.onresult = (event) => {
            let fullTranscript = '';
            for (let i = 0; i < event.results.length; ++i) {
                fullTranscript += event.results[i][0].transcript;
            }

            // Đoạn chữ mới xuất hiện chưa được gửi dịch
            const newText = fullTranscript.substring(processedLength).trim();
            document.getElementById("livePreview").innerText = newText ? ("🇨🇳 Đang nghe: " + newText) : "Đang lắng nghe...";

            if (!newText) return;

            // 1. Nếu câu quá 12 chữ Hán -> CẮT DỊCH NGAY
            if (newText.length >= CHUNK_MAX_CHARS) {
                dispatchChunk(newText);
                processedLength = fullTranscript.length;
                if (chunkTimer) clearTimeout(chunkTimer);
                return;
            }

            // 2. Nếu gặp dấu ngắt câu tiếng Trung (，。！？) -> CẮT DỊCH NGAY
            if (/[，。！？；]/.test(newText)) {
                dispatchChunk(newText);
                processedLength = fullTranscript.length;
                if (chunkTimer) clearTimeout(chunkTimer);
                return;
            }

            // 3. Nếu người nói dừng nhẹ 0.45s (ngắt nhịp thở) -> CẮT DỊCH NGAY
            if (chunkTimer) clearTimeout(chunkTimer);
            chunkTimer = setTimeout(() => {
                const pending = fullTranscript.substring(processedLength).trim();
                if (pending.length >= 2) { // Tối thiểu 2 chữ có nghĩa
                    dispatchChunk(pending);
                    processedLength = fullTranscript.length;
                }
            }, IDLE_DISPATCH_MS);
        };

        recognition.onerror = (e) => {
            addLog("STT_ERR", "Lỗi nhận diện: " + e.error);
        };

        // Tự động kết nối lại nếu Safari ngắt mic do khoảng lặng dài
        recognition.onend = () => {
            if (isMeetingActive) {
                try { recognition.start(); } catch(e){}
            }
        };
    } else {
        alert("Vui lòng mở trên Safari của iPhone để dùng tính năng nhận dạng giọng nói!");
    }

    function toggleMeeting() {
        const key = document.getElementById("apiKey").value.trim();
        if (!key) { alert("Vui lòng nhập Gemini API Key!"); return; }

        if (isMeetingActive) {
            isMeetingActive = false;
            document.getElementById("mainBtn").classList.remove("active");
            document.getElementById("btnText").innerText = "BẮT ĐẦU DỊCH CUỘC HỌP";
            document.getElementById("livePreview").innerText = "Đã dừng cuộc họp.";
            try { recognition.stop(); } catch(e){}
            addLog("STATE", "Đã dừng cuộc họp.");
        } else {
            unlockAudio();
            isMeetingActive = true;
            processedLength = 0;
            document.getElementById("mainBtn").classList.add("active");
            document.getElementById("btnText").innerText = "DỪNG CUỘC HỌP";
            document.getElementById("livePreview").innerText = "Đang lắng nghe đối tác Trung Quốc...";
            try { recognition.start(); } catch(e){}
            addLog("STATE", "Bắt đầu cuộc họp.");
        }
    }

    // ĐẨY PHÂN ĐOẠN ĐI DỊCH
    function dispatchChunk(chineseChunk) {
        if (!chineseChunk) return;
        addLog("CHUNK", `Ngắt phân đoạn: "${chineseChunk}"`);

        // Tạo khung thẻ trên màn hình ngay lập tức
        const transcriptBox = document.getElementById("transcript");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="card-zh">🇨🇳 ${chineseChunk}</div>
            <div class="card-vi">⏳ Đang dịch...</div>
        `;
        transcriptBox.prepend(card);

        // Gửi tới Gemini dịch siêu tốc
        translateWithAI(chineseChunk, card);
    }

    async function translateWithAI(text, cardElement) {
        const apiKey = document.getElementById("apiKey").value.trim();
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${apiKey}`;

        const prompt = `Dịch cụm từ tiếng Trung trong cuộc họp sau sang tiếng Việt tự nhiên chuẩn ngữ cảnh. CHỈ TRẢ VỀ DUY NHẤT CÂU DỊCH TIẾNG VIỆT:\n"${text}"`;

        const startTime = Date.now();

        try {
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        maxOutputTokens: 60,
                        temperature: 0.1
                    }
                })
            });

            const data = await response.json();
            const elapsed = Date.now() - startTime;

            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                const viText = data.candidates[0].content.parts[0].text.trim();
                cardElement.querySelector(".card-vi").innerText = "🇻🇳 " + viText;
                addLog("AI_DONE", `Dịch [${elapsed}ms]: "${viText}"`);

                // Đẩy vào hàng đợi đọc nếu được bật
                if (document.getElementById("ttsCheckbox").checked) {
                    enqueueTTS(viText);
                }
            } else {
                cardElement.querySelector(".card-vi").innerText = "⚠️ Không dịch được cụm này.";
            }
        } catch (e) {
            addLog("AI_ERR", e.message);
            cardElement.querySelector(".card-vi").innerText = "⚠️ Lỗi kết nối AI.";
        }
    }

    // HÀNG ĐỢI PHÁT ÂM TIẾNG VIỆT (TTS QUEUE - KHÔNG BỊ ĐÈ TIẾNG)
    function enqueueTTS(text) {
        ttsQueue.push(text);
        if (!isSpeaking) {
            processTTSQueue();
        }
    }

    function processTTSQueue() {
        if (ttsQueue.length === 0) {
            isSpeaking = false;
            return;
        }

        isSpeaking = true;
        const textToSpeak = ttsQueue.shift();

        if (!window.speechSynthesis) {
            isSpeaking = false;
            return;
        }

        window.speechSynthesis.resume();
        const u = new SpeechSynthesisUtterance(textToSpeak);
        u.lang = 'vi-VN';
        u.rate = 1.15; // Tăng tốc độ đọc lên 1.15 để theo kịp nhịp nói cuộc họp

        const voices = window.speechSynthesis.getVoices();
        const viVoice = voices.find(v => v.lang && (v.lang.startsWith('vi') || v.lang.includes('VIE')));
        if (viVoice) u.voice = viVoice;

        u.onend = () => {
            // Đọc xong câu này, tự động lấy câu tiếp theo trong hàng đợi đọc tiếp
            processTTSQueue();
        };

        u.onerror = () => {
            processTTSQueue();
        };

        window.speechSynthesis.speak(u);
    }
</script>

</body>
</html>
