<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên Dịch Cuộc Họp Whisper AI</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f1f5f9; margin: 0; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; height: 96vh; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .app-title { font-weight: bold; font-size: 15px; color: #f97316; display: flex; align-items: center; gap: 6px; }
        .version-badge { background: #ea580c; color: white; font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 20px; }

        .header { background: #1e293b; padding: 10px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; }
        .key-row { display: flex; gap: 6px; margin-top: 4px; }
        input { flex: 1; padding: 8px 12px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: white; font-size: 13px; }
        .btn-paste { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }

        .meter-box { background: #1e293b; border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 12px; color: #94a3b8; }
        .meter-info { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .meter-bar { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
        .meter-fill { width: 0%; height: 100%; background: #22c55e; transition: width 0.08s ease; }

        .btn-mic {
            width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; font-size: 15px; cursor: pointer;
            background: #f97316; color: white; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(249,115,22,0.4); margin-bottom: 8px;
        }
        .btn-mic.active { background: #dc2626; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .options-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; margin-bottom: 8px; padding: 0 4px; }

        .status-box {
            background: #1e293b; border-left: 3px solid #f97316; padding: 10px 12px; border-radius: 8px;
            font-size: 13px; min-height: 40px; color: #fdba74; margin-bottom: 8px; display: flex; align-items: center;
        }

        .transcript-box {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
            padding-right: 4px; scroll-behavior: smooth;
        }
        .card { background: #1e293b; padding: 12px; border-radius: 10px; border: 1px solid #334155; }
        .card-zh { color: #94a3b8; font-size: 14px; margin-bottom: 4px; line-height: 1.4; }
        .card-vi { color: #4ade80; font-size: 16px; font-weight: bold; line-height: 1.4; }

        .footer-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; color: #64748b; }
        .btn-log { background: #334155; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; }

        .log-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; padding: 20px; z-index: 9999; }
        .log-content { background: #0f172a; border: 1px solid #334155; border-radius: 12px; flex: 1; display: flex; flex-direction: column; padding: 15px; }
        textarea#logViewer { flex: 1; width: 100%; background: #020617; color: #a5f3fc; border: 1px solid #1e293b; border-radius: 6px; padding: 10px; font-family: monospace; font-size: 11px; resize: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="app-title">⚡ Whisper AI Cabin (Groq)</div>
        <div class="version-badge">v5.1 (Fast Key Auto-Load)</div>
    </div>

    <!-- Khu vực nhập/lưu API Key -->
    <div class="header">
        <label>Groq API Key (bắt đầu bằng <code>gsk_...</code>):</label>
        <div class="key-row">
            <input type="password" id="apiKey" placeholder="Dán Groq API Key vào đây..." oninput="saveKey()">
            <button class="btn-paste" onclick="pasteQuick()">📋 Dán</button>
        </div>
    </div>

    <div class="meter-box">
        <div class="meter-info">
            <span id="micDeviceLabel">Đang quét Micro...</span>
            <span id="meterText">0%</span>
        </div>
        <div class="meter-bar"><div id="meterFill" class="meter-fill"></div></div>
    </div>

    <button id="mainBtn" class="btn-mic" onclick="toggleMeeting()">
        <span>🎙️</span> <span id="btnText">BẮT ĐẦU PHIÊN DỊCH WHISPER AI</span>
    </button>

    <div class="options-bar">
        <span>Độ nhạy: Whisper AI (Chuẩn ChatGPT)</span>
        <label style="cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <input type="checkbox" id="ttsCheckbox" checked> Đọc tiếng Việt (🎧)
        </label>
    </div>

    <div class="status-box" id="statusBox">Sẵn sàng. Bấm bắt đầu để nghe đối tác nói...</div>
    <div class="transcript-box" id="transcript"></div>

    <div class="footer-tools">
        <span>Tự động chuyển AirPod &lt;&gt; Mic máy</span>
        <button class="btn-log" onclick="openLog()">📋 Xem Log</button>
    </div>
</div>

<audio id="audioFallback" style="display:none;"></audio>

<!-- Modal Log -->
<div class="log-modal" id="logModal">
    <div class="log-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <b style="color:#f97316;">Nhật Ký Whisper AI</b>
            <div>
                <button onclick="copyLog()" style="background:#22c55e; color:white; border:none; padding:4px 8px; border-radius:4px;">Copy</button>
                <button onclick="closeLog()" style="background:#64748b; color:white; border:none; padding:4px 8px; border-radius:4px;">Đóng</button>
            </div>
        </div>
        <textarea id="logViewer" readonly></textarea>
    </div>
</div>

<script>
    // =========================================================================
    // 👉 CÁCH 1: BẠN CÓ THỂ DÁN TRỰC TIẾP KEY VÀO ĐÂY ĐỂ MỖI LẦN ĐỔI CODE
    // WEB SẼ TỰ NHẬN LUÔN MÀ KHÔNG CẦN NHẬP LẠI TRÊN IPHONE:
    const MY_EMBEDDED_GROQ_KEY = ""; // Ví dụ: "gsk_xxxxxxxxx..."
    // =========================================================================

    const logs = [];
    let isMeetingActive = false;
    let isSpeaking = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let analyser = null;
    let micStream = null;
    let animId = null;

    let recordStartTime = 0;
    let silenceStart = Date.now();
    let isVoiceDetected = false;
    const VOICE_THRESHOLD = 14; 
    const SILENCE_LIMIT = 500;
    const MAX_RECORD_TIME = 4500;

    const ttsQueue = [];
    let isTTSProcessing = false;

    function addLog(tag, msg, data = null) {
        const time = new Date().toLocaleTimeString();
        let item = `[${time}] [${tag}] ${msg}`;
        if (data) item += "\n" + (typeof data === 'object' ? JSON.stringify(data) : data);
        logs.push(item);
        console.log(item);
        const v = document.getElementById("logViewer");
        if (v) v.value = logs.join("\n\n");
    }

    function openLog() { document.getElementById("logModal").style.display = "flex"; }
    function closeLog() { document.getElementById("logModal").style.display = "none"; }
    function copyLog() {
        navigator.clipboard.writeText(document.getElementById("logViewer").value);
        alert("Đã copy toàn bộ log!");
    }

    function getEffectiveKey() {
        const inputVal = document.getElementById("apiKey").value.trim();
        if (inputVal) return inputVal;
        if (MY_EMBEDDED_GROQ_KEY && MY_EMBEDDED_GROQ_KEY.trim()) return MY_EMBEDDED_GROQ_KEY.trim();
        return localStorage.getItem("groq_key") || "";
    }

    window.onload = () => {
        // Tự động load: ưu tiên key gán sẵn trong code, tiếp đến localStorage
        if (MY_EMBEDDED_GROQ_KEY && MY_EMBEDDED_GROQ_KEY.trim()) {
            document.getElementById("apiKey").value = MY_EMBEDDED_GROQ_KEY.trim();
            addLog("AUTH", "Đã nạp Groq Key từ code.");
        } else {
            const saved = localStorage.getItem("groq_key");
            if (saved) {
                document.getElementById("apiKey").value = saved;
                addLog("AUTH", "Đã nạp Groq Key từ bộ nhớ máy.");
            }
        }
    };

    function saveKey() {
        const k = document.getElementById("apiKey").value.trim();
        localStorage.setItem("groq_key", k);
    }

    async function pasteQuick() {
        try {
            const text = await navigator.clipboard.readText();
            if (text && text.trim()) {
                document.getElementById("apiKey").value = text.trim();
                saveKey();
                alert("✅ Đã dán và lưu Key thành công!");
                addLog("AUTH", "Đã dán Key từ Clipboard.");
            }
        } catch (e) {
            // Nếu Safari hỏi quyền thì người dùng dán tay
            document.getElementById("apiKey").focus();
        }
    }

    if (navigator.mediaDevices && navigator.mediaDevices.ondevicechange !== undefined) {
        navigator.mediaDevices.ondevicechange = async () => {
            addLog("DEVICE", "Phát hiện đổi thiết bị Micro.");
            if (isMeetingActive || micStream) await restartMic();
        };
    }

    function unlockAudio() {
        if (window.speechSynthesis) {
            window.speechSynthesis.resume();
            const u = new SpeechSynthesisUtterance(" ");
            u.volume = 0.01;
            window.speechSynthesis.speak(u);
        }
        const a = document.getElementById("audioFallback");
        if (a) {
            a.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
            a.play().catch(()=>{});
        }
    }

    async function toggleMeeting() {
        const key = getEffectiveKey();
        if (!key) { alert("Vui lòng nhập hoặc dán Groq API Key!"); return; }

        if (isMeetingActive) {
            isMeetingActive = false;
            stopRecordingChunk();
            if (animId) cancelAnimationFrame(animId);
            if (micStream) micStream.getTracks().forEach(t => t.stop());

            document.getElementById("mainBtn").classList.remove("active");
            document.getElementById("btnText").innerText = "BẮT ĐẦU PHIÊN DỊCH WHISPER AI";
            document.getElementById("statusBox").innerText = "Đã dừng cuộc họp.";
            document.getElementById("meterFill").style.width = "0%";
            document.getElementById("meterText").innerText = "0%";
            addLog("STATE", "Đã dừng.");
        } else {
            unlockAudio();
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') await audioContext.resume();

            const ok = await initMicrophone();
            if (!ok) return;

            isMeetingActive = true;
            document.getElementById("mainBtn").classList.add("active");
            document.getElementById("btnText").innerText = "DỪNG CUỘC HỌP";
            document.getElementById("statusBox").innerText = "🎧 Whisper AI đang lắng nghe tiếng Trung...";
            addLog("STATE", "Đã kích hoạt Whisper AI.");
        }
    }

    async function initMicrophone() {
        try {
            if (micStream) micStream.getTracks().forEach(t => t.stop());

            micStream = await navigator.mediaDevices.getUserMedia({
                audio: { autoGainControl: true, noiseSuppression: false, echoCancellation: true }
            });

            const tracks = micStream.getAudioTracks();
            if (tracks.length > 0) {
                const label = tracks[0].label || "Micro mặc định";
                document.getElementById("micDeviceLabel").innerText = `🎙️ ${label}`;
                addLog("MIC_INFO", `Đang dùng: ${label}`);
                tracks[0].onended = async () => { await restartMic(); };
            }

            setupAudioPipeline();
            return true;
        } catch (err) {
            alert("Vui lòng cấp quyền Micro trong Safari!");
            addLog("MIC_ERR", err.message);
            return false;
        }
    }

    async function restartMic() {
        if (animId) cancelAnimationFrame(animId);
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        await initMicrophone();
    }

    function setupAudioPipeline() {
        const source = audioContext.createMediaStreamSource(micStream);
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        initMediaRecorder();

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        const fill = document.getElementById("meterFill");
        const txt = document.getElementById("meterText");

        function analyzeLoop() {
            if (!isMeetingActive) return;

            if (isSpeaking) {
                fill.style.width = "0%";
                txt.innerText = "🔊 Đang đọc...";
                animId = requestAnimationFrame(analyzeLoop);
                return;
            }

            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let avg = sum / dataArray.length;
            let percent = Math.min(100, Math.round((avg / 35) * 100));

            fill.style.width = percent + "%";
            txt.innerText = percent + "%";

            const now = Date.now();

            if (percent >= VOICE_THRESHOLD) {
                silenceStart = now;
                if (!isVoiceDetected) {
                    isVoiceDetected = true;
                    recordStartTime = now;
                    document.getElementById("statusBox").innerText = "🎙️ Đang nghe tiếng Trung...";
                    startRecordingChunk();
                }

                if (now - recordStartTime > MAX_RECORD_TIME) {
                    isVoiceDetected = false;
                    document.getElementById("statusBox").innerText = "⚡ Whisper đang bóc tách âm thanh...";
                    stopRecordingChunk();
                }
            } else {
                if (isVoiceDetected && (now - silenceStart > SILENCE_LIMIT)) {
                    isVoiceDetected = false;
                    document.getElementById("statusBox").innerText = "⚡ Whisper đang bóc tách âm thanh...";
                    stopRecordingChunk();
                }
            }

            animId = requestAnimationFrame(analyzeLoop);
        }
        analyzeLoop();
    }

    function initMediaRecorder() {
        let mime = 'audio/mp4';
        if (!MediaRecorder.isTypeSupported('audio/mp4')) {
            mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
        }

        mediaRecorder = new MediaRecorder(micStream, mime ? { mimeType: mime } : {});
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
            if (audioChunks.length === 0) return;
            const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/mp4' });
            audioChunks = [];
            
            if (audioBlob.size > 1200) {
                processAudioWithWhisperAndLlama(audioBlob);
            } else {
                document.getElementById("statusBox").innerText = "🎧 Đang tiếp tục lắng nghe...";
            }
        };
    }

    function startRecordingChunk() {
        audioChunks = [];
        if (mediaRecorder && mediaRecorder.state === 'inactive') {
            mediaRecorder.start();
        }
    }

    function stopRecordingChunk() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
    }

    // 1. GỬI ÂM THANH SANG WHISPER AI
    async function processAudioWithWhisperAndLlama(blob) {
        const apiKey = getEffectiveKey();
        const startTime = Date.now();

        const ext = (blob.type && blob.type.includes('mp4')) ? 'm4a' : 'webm';
        const formData = new FormData();
        formData.append("file", blob, `audio.${ext}`);
        formData.append("model", "whisper-large-v3-turbo");
        formData.append("language", "zh");
        formData.append("response_format", "json");

        addLog("WHISPER_REQ", `Gửi ${Math.round(blob.size/1024)}KB âm thanh tới Whisper AI...`);

        try {
            const whisperRes = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${apiKey}` },
                body: formData
            });

            const whisperData = await whisperRes.json();
            const whisperElapsed = Date.now() - startTime;

            if (whisperData.text && whisperData.text.trim()) {
                const chineseText = whisperData.text.trim();
                addLog("WHISPER_DONE", `Whisper bóc tách [${whisperElapsed}ms]: "${chineseText}"`);

                if (chineseText === "谢谢" && blob.size < 3000) return;

                const card = createCard(chineseText);
                await translateWithLlama(chineseText, card, apiKey);
            } else {
                document.getElementById("statusBox").innerText = "🎧 Đang tiếp tục lắng nghe...";
            }
        } catch (err) {
            addLog("WHISPER_ERR", err.message);
            document.getElementById("statusBox").innerText = "🎧 Đang tiếp tục lắng nghe...";
        }
    }

    function createCard(chineseText) {
        const transcriptBox = document.getElementById("transcript");
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="card-zh">🇨🇳 ${chineseText}</div>
            <div class="card-vi">⏳ Đang dịch ngữ cảnh...</div>
        `;
        transcriptBox.prepend(card);
        return card;
    }

    // 2. DỊCH BẰNG LLAMA 3.3 70B
    async function translateWithLlama(text, cardElement, apiKey) {
        const startTime = Date.now();
        const prompt = `Bạn là phiên dịch viên cabin cuộc họp Trung - Việt chuyên nghiệp. 
Dịch câu tiếng Trung sau sang tiếng Việt chuẩn xác, tự nhiên, đúng ngữ cảnh hội họp.
CHỈ TRẢ VỀ DUY NHẤT CÂU TIẾNG VIỆT ĐÃ DỊCH, KHÔNG THÊM LỜI GIẢI THÍCH HAY BẤT KỲ KÝ TỰ NÀO KHÁC.

Câu tiếng Trung: "${text}"`;

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: prompt }],
                    temperature: 0.1,
                    max_tokens: 150
                })
            });

            const data = await res.json();
            const elapsed = Date.now() - startTime;

            if (data.choices && data.choices[0].message.content) {
                const viText = data.choices[0].message.content.trim();
                cardElement.querySelector(".card-vi").innerText = "🇻🇳 " + viText;
                addLog("LLAMA_DONE", `Dịch xong [${elapsed}ms]: "${viText}"`);

                if (document.getElementById("ttsCheckbox").checked) {
                    enqueueTTS(viText);
                }
            }
        } catch (err) {
            addLog("LLAMA_ERR", err.message);
            cardElement.querySelector(".card-vi").innerText = "⚠️ Lỗi dịch.";
        }
    }

    // 3. HÀNG ĐỢI PHÁT ÂM TIẾNG VIỆT
    function enqueueTTS(text) {
        ttsQueue.push(text);
        if (!isTTSProcessing) {
            processNextTTS();
        }
    }

    function processNextTTS() {
        if (ttsQueue.length === 0) {
            isTTSProcessing = false;
            isSpeaking = false;
            document.getElementById("statusBox").innerText = "🎧 Whisper AI đang lắng nghe...";
            return;
        }

        isTTSProcessing = true;
        isSpeaking = true;
        const text = ttsQueue.shift();

        document.getElementById("statusBox").innerText = `🔊 Đang đọc: "${text}"`;

        if (window.speechSynthesis) {
            window.speechSynthesis.cancel();
            window.speechSynthesis.resume();

            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'vi-VN';
            u.rate = 1.15;

            const voices = window.speechSynthesis.getVoices();
            const viVoice = voices.find(v => v.lang && (v.lang.startsWith('vi') || v.lang.includes('VIE')));
            if (viVoice) u.voice = viVoice;

            u.onend = () => { setTimeout(processNextTTS, 200); };
            u.onerror = () => { setTimeout(processNextTTS, 200); };
            window.speechSynthesis.speak(u);
        } else {
            processNextTTS();
        }
    }
</script>

</body>
</html>
